<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0908">
  <title>Radio Voz Cristiana · Sin conexión</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; text-align: center; color: #f7f4ec; background: #0a0908; }
    main { width: min(90%, 420px); padding: 32px; border: 1px solid #3a2e1e; border-radius: 24px; background: #171208; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; }
    h1 { margin: 0 0 10px; font-size: 1.5rem; }
    p { margin: 0; color: #a89c86; line-height: 1.5; }
    button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 12px; color: #171208; background: #ffd400; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="https://i.ibb.co/5mCYLzh/VOZ-CRISTIANA.jpg" alt="Radio Voz Cristiana">
    <h1>Estás sin conexión</h1>
    <p>La aplicación está instalada, pero necesitas internet para escuchar la transmisión en vivo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
